interface:
  display_name: "Command Failure Memory"
  short_description: "Handle failed command and retry loops by recording failures, querying history before rerun, and writing back verified fixes"
  default_prompt: "Automatically use $command-failure-memory when a command has just failed or is about to be retried after an unsuccessful run. Trigger off execution outcome, not a hardcoded error list: non-zero exits, timeouts, tool-call failures, or output/context showing the command did not complete successfully all count. First verify the Windows host Codex home and its WSL equivalent path; pass that absolute path explicitly with --codex-home on every backend invocation. Do not fall back to Linux HOME or create another memory store. In WSL, run the bundled Python backend with python3 from skills/command-failure-memory/scripts/command-failure-memory.py in the current workspace first; if absent, use $CODEX_HOME/skills/command-failure-memory/scripts/command-failure-memory.py. Run record-failure immediately, query-before-retry before rerun, and record-success after the fix is verified, even if the user did not mention the skill."
