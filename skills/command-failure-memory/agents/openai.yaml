interface:
  display_name: "Command Failure Memory"
  short_description: "Handle failed command and retry loops by recording failures, querying history before rerun, and writing back verified fixes"
  default_prompt: "Automatically use $command-failure-memory when a command has just failed or is about to be retried after an unsuccessful run. Trigger off execution outcome, not a hardcoded error list: non-zero exits, timeouts, tool-call failures, or output/context showing the command did not complete successfully all count. Resolve the bundled launcher from .\\skills\\command-failure-memory\\scripts\\command-failure-memory.cmd in the current workspace first; if absent, try %CODEX_HOME%\\skills\\command-failure-memory\\scripts\\command-failure-memory.cmd; if still absent, fall back to %USERPROFILE%\\.codex\\skills\\command-failure-memory\\scripts\\command-failure-memory.cmd. Run record-failure immediately, query-before-retry before rerun, and record-success after the fix is verified, even if the user did not mention the skill."
